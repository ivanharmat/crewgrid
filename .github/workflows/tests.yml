name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10', '11', '12', '13']
        include:
          - laravel: '10'
            testbench: '8.*'
          - laravel: '11'
            testbench: '9.*'
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'
        exclude:
          # Laravel 10 supports PHP 8.1-8.3; 11 and 12 need >= 8.2; 13 needs >= 8.3.
          - php: '8.1'
            laravel: '11'
          - php: '8.1'
            laravel: '12'
          - php: '8.1'
            laravel: '13'
          - php: '8.2'
            laravel: '13'
          - php: '8.4'
            laravel: '10'
          - php: '8.5'
            laravel: '10'
          - php: '8.5'
            laravel: '11'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  # The floor the composer.json claims: oldest supported everything, resolved
  # with --prefer-lowest so version drift in a dependency fails loudly here
  # rather than in a consumer's install.
  lowest:
    runs-on: ubuntu-latest
    name: PHP 8.1 / Laravel 10 / prefer-lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, sqlite3
          coverage: none

      - name: Install lowest dependencies
        run: |
          composer require "laravel/framework:^10.0" "orchestra/testbench:8.*" --no-interaction --no-update --dev
          composer update --prefer-dist --prefer-lowest --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
